<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="t d">
  <title id="t">Save a place from wherever you found it</title>
  <desc id="d">A TikTok, an Instagram post, a Google Maps link and a screenshot of a friend's notes all flow into B33n through the share sheet or the import screen, and come out as places saved to your Want to Go list.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#1B3CFF"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B2718" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3B2718; }
    .src { font-size: 22px; font-weight: 700; }
    .sub { font-size: 17px; fill: #7A6B5D; }
    .row { font-size: 21px; font-weight: 700; }
  </style>

  <rect width="1600" height="640" fill="#EDE7DB"/>

  <!-- sources, fanned -->
  <g transform="translate(90 70) rotate(-4)" filter="url(#soft)">
    <rect width="400" height="100" rx="18" fill="#FFFDF8"/>
    <rect x="18" y="18" width="64" height="64" rx="14" fill="#3B2718"/>
    <path d="M42 36 64 50 42 64Z" fill="#F5F1E6"/>
    <text class="src" x="102" y="46">A TikTok you watched</text>
    <text class="sub" x="102" y="74">“best pastéis in Belém”</text>
  </g>
  <g transform="translate(120 196) rotate(2)" filter="url(#soft)">
    <rect width="400" height="100" rx="18" fill="#FFFDF8"/>
    <rect x="18" y="18" width="64" height="64" rx="14" fill="#B05C7A"/>
    <rect x="32" y="34" width="36" height="32" rx="6" stroke="#F5F1E6" stroke-width="4" fill="none"/>
    <path d="M34 62 45 50 53 58 58 53 66 62Z" fill="#F5F1E6"/>
    <circle cx="59" cy="43" r="4" fill="#F5F1E6"/>
    <text class="src" x="102" y="46">An Instagram post</text>
    <text class="sub" x="102" y="74">A rooftop someone tagged</text>
  </g>
  <g transform="translate(86 322) rotate(-2)" filter="url(#soft)">
    <rect width="400" height="100" rx="18" fill="#FFFDF8"/>
    <rect x="18" y="18" width="64" height="64" rx="14" fill="#5A8FAD"/>
    <path d="M50 70C46 62 36 56 36 46a14 14 0 0 1 28 0c0 10-10 16-14 24Z" fill="#F5F1E6"/>
    <circle cx="50" cy="46" r="5" fill="#5A8FAD"/>
    <text class="src" x="102" y="46">A Google Maps link</text>
    <text class="sub" x="102" y="74">Pasted from the group chat</text>
  </g>
  <g transform="translate(116 448) rotate(3)" filter="url(#soft)">
    <rect width="400" height="100" rx="18" fill="#FFFDF8"/>
    <rect x="18" y="18" width="64" height="64" rx="14" fill="#C4A235"/>
    <path d="M34 36h32M34 48h32M34 60h20" stroke="#F5F1E6" stroke-width="5" stroke-linecap="round"/>
    <text class="src" x="102" y="46">A screenshot of notes</text>
    <text class="sub" x="102" y="74">Your friend's list of 14 spots</text>
  </g>

  <!-- arrows in -->
  <g fill="none" stroke="#1B3CFF" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M520 120C620 140 640 240 690 290"/>
    <path d="M540 250C600 260 640 290 684 310"/>
    <path d="M510 370C600 370 640 350 684 334"/>
    <path d="M540 500C620 490 640 400 690 354"/>
    <path d="M920 320H1010"/>
  </g>

  <!-- B33n in the middle -->
  <g transform="translate(700 210)" filter="url(#soft)">
    <rect width="220" height="220" rx="50" fill="#4A2F22"/>
  </g>
  <g transform="translate(700 210)">
    <path d="M70 64c-8-16-22-30-30-36M84 58c-4-18-12-34-18-42M98 56c2-18 0-34-4-46" stroke="#F5F1E6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M150 64c8-16 22-30 30-36M136 58c4-18 12-34 18-42M122 56c-2-18 0-34 4-46" stroke="#F5F1E6" stroke-width="12" stroke-linecap="round" fill="none"/>
    <text x="110" y="168" text-anchor="middle" style="font-size:64px;font-weight:800;fill:#F5F1E6;letter-spacing:-.02em">B<tspan style="fill:#D08159">33</tspan>n</text>
  </g>
  <text class="sub" x="810" y="476" text-anchor="middle">Share sheet or Import</text>

  <!-- results -->
  <g transform="translate(1030 110)" filter="url(#soft)">
    <rect width="480" height="420" rx="26" fill="#FFFDF8"/>
  </g>
  <g transform="translate(1030 110)">
    <text x="30" y="58" style="font-size:26px;font-weight:700">Saved to Want to Go</text>
    <text class="sub" x="30" y="88">Matched to the real place, with a map pin</text>
    <g transform="translate(30 118)">
      <rect width="420" height="62" rx="14" fill="#F5F1E6"/>
      <circle cx="31" cy="31" r="14" fill="#D98C5F"/>
      <text class="row" x="60" y="39">Pastelaria, Belém</text>
      <path d="M380 31l8 8 16-16" stroke="#5B8A72" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(30 192)">
      <rect width="420" height="62" rx="14" fill="#F5F1E6"/>
      <circle cx="31" cy="31" r="14" fill="#5F7FA3"/>
      <text class="row" x="60" y="39">Rooftop bar, Chiado</text>
      <path d="M380 31l8 8 16-16" stroke="#5B8A72" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(30 266)">
      <rect width="420" height="62" rx="14" fill="#F5F1E6"/>
      <circle cx="31" cy="31" r="14" fill="#C1694F"/>
      <text class="row" x="60" y="39">Tasca do Bairro</text>
      <path d="M380 31l8 8 16-16" stroke="#5B8A72" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(30 340)">
      <rect width="420" height="62" rx="14" fill="#F5F1E6"/>
      <circle cx="31" cy="31" r="14" fill="#8E4A5B"/>
      <text class="row" x="60" y="39">+ 11 more from the notes</text>
    </g>
  </g>
</svg>
