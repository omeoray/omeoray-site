<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-labelledby="t d">
  <title id="t">How a B33n rec request works</title>
  <desc id="d">Three steps. First, you send one link asking where to go in Lisbon. Second, three friends open the link in their phone's browser and add places, with no app needed. Third, their places land on your map in your Want to Go list.</desc>
  <defs>
    <path id="pin" d="M0 0C-5-12-20-22-20-39A20 20 0 1 1 20-39C20-22 5-12 0 0Z"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#1B3CFF"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B2718" flood-opacity="0.14"/>
    </filter>
    <clipPath id="map"><rect x="1180" y="214" width="340" height="462" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3B2718; }
    .step { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 20px; font-weight: 600; letter-spacing: .14em; fill: #7A6B5D; }
    .url { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; fill: #7A6B5D; }
    .name { font-size: 21px; font-weight: 700; }
    .small { font-size: 17px; fill: #7A6B5D; }
    .vibe { font-size: 15px; font-weight: 600; }
    .ini { font-size: 17px; font-weight: 700; fill: #F5F1E6; text-anchor: middle; }
  </style>

  <rect width="1600" height="760" fill="#EDE7DB"/>

  <text class="step" x="80" y="70">01 · ASK ONCE</text>
  <text class="step" x="560" y="70">02 · FRIENDS ANSWER</text>
  <text class="step" x="1160" y="70">03 · IT'S ON YOUR MAP</text>

  <!-- arrows -->
  <g fill="none" stroke="#1B3CFF" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M400 360C470 300 480 200 548 190"/>
    <path d="M400 390H548"/>
    <path d="M400 420C470 480 480 580 548 590"/>
    <path d="M1012 190C1080 200 1080 300 1148 330"/>
    <path d="M1012 390H1148"/>
    <path d="M1012 590C1080 580 1080 480 1148 450"/>
  </g>

  <!-- 01 the phone -->
  <g filter="url(#soft)"><rect x="80" y="110" width="310" height="590" rx="46" fill="#3B2718"/></g>
  <rect x="93" y="123" width="284" height="564" rx="34" fill="#F5F1E6"/>
  <rect x="190" y="136" width="90" height="24" rx="12" fill="#3B2718"/>
  <text x="117" y="214" style="font-size:28px;font-weight:700">Ask for recs</text>
  <text class="small" x="117" y="244">Lisbon · Portugal</text>
  <rect x="117" y="276" width="236" height="132" rx="20" fill="#5C3D2E"/>
  <text x="137" y="318" style="font-size:20px;font-weight:600;fill:#F5F1E6">Off to Lisbon soon.</text>
  <text x="137" y="348" style="font-size:20px;font-weight:600;fill:#F5F1E6">Where should I go?</text>
  <text x="137" y="384" style="font-size:16px;fill:#CBBBAC">Food, wine, views</text>
  <rect x="117" y="428" width="236" height="48" rx="24" fill="#FFFDF8" stroke="#CEC9BA" stroke-width="2"/>
  <text class="url" x="138" y="458">b33n.link/r/…</text>
  <!-- tiny QR -->
  <g transform="translate(175 500)">
    <rect width="120" height="120" rx="12" fill="#FFFFFF"/>
    <g fill="#3B2718">
      <rect x="12" y="12" width="30" height="30" rx="4"/><rect x="78" y="12" width="30" height="30" rx="4"/><rect x="12" y="78" width="30" height="30" rx="4"/>
      <rect x="50" y="14" width="10" height="10"/><rect x="62" y="30" width="10" height="10"/><rect x="50" y="50" width="20" height="10"/>
      <rect x="80" y="54" width="10" height="20"/><rect x="96" y="66" width="12" height="10"/><rect x="52" y="76" width="10" height="20"/>
      <rect x="70" y="90" width="20" height="10"/><rect x="96" y="90" width="12" height="18"/><rect x="14" y="54" width="20" height="10"/>
    </g>
    <g fill="#FFFFFF"><rect x="20" y="20" width="14" height="14" rx="2"/><rect x="86" y="20" width="14" height="14" rx="2"/><rect x="20" y="86" width="14" height="14" rx="2"/></g>
  </g>
  <text class="small" x="235" y="660" text-anchor="middle">Send by message or QR</text>

  <!-- 02 three friends in the browser -->
  <g id="card1" transform="translate(560 110)">
    <g filter="url(#soft)"><rect width="440" height="164" rx="18" fill="#FFFDF8"/></g>
    <rect width="440" height="40" rx="18" fill="#E2DCCD"/><rect y="22" width="440" height="18" fill="#E2DCCD"/>
    <circle cx="22" cy="20" r="6" fill="#C8C4B6"/><circle cx="42" cy="20" r="6" fill="#C8C4B6"/><circle cx="62" cy="20" r="6" fill="#C8C4B6"/>
    <rect x="86" y="9" width="250" height="22" rx="11" fill="#F5F1E6"/><text class="url" x="100" y="26" style="font-size:14px">b33n.link/r/…</text>
    <circle cx="44" cy="88" r="24" fill="#D4915E"/><text class="ini" x="44" y="94">K</text>
    <text class="name" x="82" y="86">Kemi added 3 places</text>
    <text class="small" x="82" y="112">In the browser, no app needed</text>
    <rect x="82" y="124" width="104" height="28" rx="14" fill="#5A8FAD" fill-opacity=".16"/><text class="vibe" x="134" y="143" text-anchor="middle">Views</text>
    <rect x="194" y="124" width="124" height="28" rx="14" fill="#D4915E" fill-opacity=".2"/><text class="vibe" x="256" y="143" text-anchor="middle">Hidden Gem</text>
  </g>
  <g transform="translate(560 310)">
    <g filter="url(#soft)"><rect width="440" height="164" rx="18" fill="#FFFDF8"/></g>
    <rect width="440" height="40" rx="18" fill="#E2DCCD"/><rect y="22" width="440" height="18" fill="#E2DCCD"/>
    <circle cx="22" cy="20" r="6" fill="#C8C4B6"/><circle cx="42" cy="20" r="6" fill="#C8C4B6"/><circle cx="62" cy="20" r="6" fill="#C8C4B6"/>
    <rect x="86" y="9" width="250" height="22" rx="11" fill="#F5F1E6"/><text class="url" x="100" y="26" style="font-size:14px">b33n.link/r/…</text>
    <circle cx="44" cy="88" r="24" fill="#8E4A5B"/><text class="ini" x="44" y="94">S</text>
    <text class="name" x="82" y="86">Sam added 4 places</text>
    <text class="small" x="82" y="112">“The orange wine here, trust me”</text>
    <rect x="82" y="124" width="134" height="28" rx="14" fill="#8E4A5B" fill-opacity=".16"/><text class="vibe" x="149" y="143" text-anchor="middle">Natural Wine</text>
    <rect x="224" y="124" width="112" height="28" rx="14" fill="#C1694F" fill-opacity=".18"/><text class="vibe" x="280" y="143" text-anchor="middle">Date Night</text>
  </g>
  <g transform="translate(560 510)">
    <g filter="url(#soft)"><rect width="440" height="164" rx="18" fill="#FFFDF8"/></g>
    <rect width="440" height="40" rx="18" fill="#E2DCCD"/><rect y="22" width="440" height="18" fill="#E2DCCD"/>
    <circle cx="22" cy="20" r="6" fill="#C8C4B6"/><circle cx="42" cy="20" r="6" fill="#C8C4B6"/><circle cx="62" cy="20" r="6" fill="#C8C4B6"/>
    <rect x="86" y="9" width="250" height="22" rx="11" fill="#F5F1E6"/><text class="url" x="100" y="26" style="font-size:14px">b33n.link/r/…</text>
    <circle cx="44" cy="88" r="24" fill="#5B8A72"/><text class="ini" x="44" y="94">J</text>
    <text class="name" x="82" y="86">Jo added 2 places</text>
    <text class="small" x="82" y="112">Signed up after pressing Send</text>
    <rect x="82" y="124" width="118" height="28" rx="14" fill="#5B8A72" fill-opacity=".18"/><text class="vibe" x="141" y="143" text-anchor="middle">Cheap Eats</text>
    <rect x="208" y="124" width="148" height="28" rx="14" fill="#C98A3A" fill-opacity=".2"/><text class="vibe" x="282" y="143" text-anchor="middle">Hangover Cure</text>
  </g>

  <!-- 03 the map -->
  <g filter="url(#soft)"><rect x="1160" y="110" width="380" height="590" rx="28" fill="#FFFDF8"/></g>
  <text x="1188" y="162" style="font-size:26px;font-weight:700">Want to Go</text>
  <text class="small" x="1188" y="190">Lisbon · 9 places from 3 friends</text>
  <rect x="1180" y="214" width="340" height="462" rx="18" fill="#E8E2D4"/>
  <g clip-path="url(#map)">
  <g fill="none" stroke="#F6F2EA" stroke-linecap="round">
    <path d="M1180 330H1520" stroke-width="14"/><path d="M1300 214V676" stroke-width="12"/><path d="M1180 520C1290 500 1400 560 1520 500" stroke-width="10"/>
  </g>
  <path d="M1180 620C1260 580 1340 660 1420 620S1500 590 1520 600" fill="none" stroke="#CBD9D9" stroke-width="34" stroke-linecap="round"/>
  </g>
  <g transform="translate(1240 300)"><use href="#pin" fill="#D4915E"/><circle cy="-39" r="7" fill="#F5F1E6"/></g>
  <g transform="translate(1380 290)"><use href="#pin" fill="#8E4A5B"/><circle cy="-39" r="7" fill="#F5F1E6"/></g>
  <g transform="translate(1460 400)"><use href="#pin" fill="#C1694F"/><circle cy="-39" r="7" fill="#F5F1E6"/></g>
  <g transform="translate(1340 450)"><use href="#pin" fill="#8E4A5B"/><circle cy="-39" r="7" fill="#F5F1E6"/></g>
  <g transform="translate(1230 470)"><use href="#pin" fill="#5B8A72"/><circle cy="-39" r="7" fill="#F5F1E6"/></g>
  <g transform="translate(1430 560)"><use href="#pin" fill="#5A8FAD"/><circle cy="-39" r="7" fill="#F5F1E6"/></g>
  <g transform="translate(1270 580)"><use href="#pin" fill="#C98A3A"/><circle cy="-39" r="7" fill="#F5F1E6"/></g>
</svg>
