<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-labelledby="t d">
  <title id="t">B33n inside your AI assistant, with a privacy boundary</title>
  <desc id="d">On the left, a chat with an AI assistant: someone asks where to eat in Lisbon on Friday, somewhere their friends rate. The assistant answers with a B33n card saying four people they follow have been, with an average rating of 4.6 and the vibes Date Night and Natural Wine. On the right, three layers show what the assistant can reach: your own places, read and write if you allow it; your friends, as counts and averages only; and names, notes and gatekept spots, which never leave B33n.</desc>
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B2718" flood-opacity="0.14"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3B2718; }
    .sub { font-size: 18px; fill: #7A6B5D; }
    .label { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; font-weight: 600; letter-spacing: .12em; }
    .big { font-size: 24px; font-weight: 700; }
  </style>

  <rect width="1600" height="780" fill="#EDE7DB"/>

  <!-- chat window -->
  <g filter="url(#soft)"><rect x="70" y="70" width="760" height="640" rx="26" fill="#FFFDF8"/></g>
  <rect x="70" y="70" width="760" height="60" rx="26" fill="#F1ECE1"/><rect x="70" y="104" width="760" height="26" fill="#F1ECE1"/>
  <circle cx="104" cy="100" r="7" fill="#CEC9BA"/><circle cx="128" cy="100" r="7" fill="#CEC9BA"/><circle cx="152" cy="100" r="7" fill="#CEC9BA"/>
  <text class="sub" x="450" y="107" text-anchor="middle" style="font-size:17px">Your AI assistant</text>

  <!-- you -->
  <rect x="300" y="160" width="500" height="92" rx="24" fill="#1B3CFF"/>
  <text x="326" y="198" style="font-size:21px;font-weight:600;fill:#FFFFFF">Where should we eat in Lisbon on</text>
  <text x="326" y="228" style="font-size:21px;font-weight:600;fill:#FFFFFF">Friday? Somewhere my friends rate.</text>

  <!-- assistant -->
  <circle cx="122" cy="300" r="20" fill="#E4DDCE"/>
  <path d="M122 288l3.5 8.5 8.5 3.5-8.5 3.5-3.5 8.5-3.5-8.5-8.5-3.5 8.5-3.5Z" fill="#7A6B5D"/>
  <text x="160" y="308" style="font-size:20px">I checked B33n. This one is a favourite</text>
  <text x="160" y="336" style="font-size:20px">with people you follow:</text>

  <g transform="translate(160 362)">
    <rect width="620" height="196" rx="20" fill="#F5F1E6" stroke="#E4DDCE" stroke-width="2"/>
    <rect x="20" y="20" width="56" height="56" rx="14" fill="#4A2F22"/>
    <text x="48" y="56" text-anchor="middle" style="font-size:20px;font-weight:800;fill:#F5F1E6">B<tspan style="fill:#D08159">33</tspan></text>
    <text class="big" x="94" y="48">Adega Nova</text>
    <text class="sub" x="94" y="72">From people you follow</text>
    <g transform="translate(20 100)">
      <rect width="170" height="72" rx="14" fill="#FFFDF8"/>
      <text x="18" y="34" style="font-size:26px;font-weight:800">4</text>
      <text class="sub" x="18" y="58" style="font-size:16px">have been</text>
      <rect x="184" width="170" height="72" rx="14" fill="#FFFDF8"/>
      <text x="202" y="34" style="font-size:26px;font-weight:800">4.6</text>
      <text class="sub" x="202" y="58" style="font-size:16px">average rating</text>
      <rect x="368" y="4" width="212" height="30" rx="15" fill="#C1694F" fill-opacity=".18"/>
      <text x="474" y="25" text-anchor="middle" style="font-size:16px;font-weight:600">Date Night</text>
      <rect x="368" y="40" width="212" height="30" rx="15" fill="#8E4A5B" fill-opacity=".16"/>
      <text x="474" y="61" text-anchor="middle" style="font-size:16px;font-weight:600">Natural Wine</text>
    </g>
  </g>
  <text x="160" y="604" style="font-size:20px">Want me to save it to your Want to Go?</text>
  <rect x="160" y="630" width="168" height="44" rx="22" fill="none" stroke="#CEC9BA" stroke-width="2"/>
  <text x="244" y="658" text-anchor="middle" style="font-size:18px;font-weight:600">Yes, save it</text>

  <!-- boundary -->
  <text class="label" x="900" y="96" style="fill:#7A6B5D">WHAT THE ASSISTANT CAN REACH</text>

  <g transform="translate(900 124)" filter="url(#soft)">
    <rect width="630" height="160" rx="22" fill="#FFFDF8"/>
  </g>
  <g transform="translate(900 124)">
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#5B8A72"/>
    <path d="M38 50l8 8 16-16" stroke="#F5F1E6" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="big" x="96" y="50">Your own places</text>
    <text class="sub" x="96" y="80">Been, Want to Go, ratings, vibes, notes.</text>
    <text class="sub" x="96" y="108">Read by default. Saving needs your OK.</text>
  </g>

  <g transform="translate(900 306)" filter="url(#soft)">
    <rect width="630" height="160" rx="22" fill="#FFFDF8"/>
  </g>
  <g transform="translate(900 306)">
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#D4915E"/>
    <text x="50" y="59" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#F5F1E6">#</text>
    <text class="big" x="96" y="50">People you follow</text>
    <text class="sub" x="96" y="80">Counts and averages for a place, never a list</text>
    <text class="sub" x="96" y="108">of who went. Only if you switch it on.</text>
  </g>

  <g transform="translate(900 488)" filter="url(#soft)">
    <rect width="630" height="196" rx="22" fill="#4A2F22"/>
  </g>
  <g transform="translate(900 488)">
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#F5F1E6"/>
    <rect x="38" y="48" width="24" height="20" rx="4" fill="#4A2F22"/>
    <path d="M42 48v-6a8 8 0 0 1 16 0v6" stroke="#4A2F22" stroke-width="4" fill="none"/>
    <text class="big" x="96" y="50" style="fill:#F5F1E6">Stays in B33n, always</text>
    <text class="sub" x="96" y="80" style="fill:#CBBBAC">Friends' names and notes. Gatekept spots.</text>
    <text class="sub" x="96" y="108" style="fill:#CBBBAC">Your follow list. Who you share with.</text>
    <text class="sub" x="96" y="148" style="fill:#F5F1E6;font-weight:600">No permission can unlock these.</text>
  </g>
</svg>
