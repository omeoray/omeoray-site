<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .ring { fill: none; stroke: #121214; stroke-width: 9; }
    .tick { fill: none; stroke: #e9540d; stroke-width: 9; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #f4f3f1; }
      .tick { stroke: #ff7a33; }
    }
  </style>
  <circle class="ring" cx="50" cy="50" r="33" stroke-dasharray="190 17" transform="rotate(-90 50 50)"/>
  <line class="tick" x1="50" y1="11" x2="50" y2="4"/>
</svg>
